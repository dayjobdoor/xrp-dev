# Keyless npm release (npm trusted publishing over OIDC: no NPM_TOKEN anywhere). Release = bump "version" in the
# packages/*/package.json that ship (core, wallet, mcp, x402), add its CHANGELOG.md heading, push to
# main. The `plan` job publishes only when npm does not have that exact version yet, so re-runs and ordinary pushes
# are no-ops. The `npm-publish` environment's required reviewers gate the publish job, after the tests passed.
# Setup: AGENTS.md "Release" (first publish by hand, then `npm trust github`). The workflow file name must stay
# `publish.yml`: it is part of the trust configuration on npmjs.com.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: plan
        run: |
          name=$(node -p "require('./packages/core/package.json').name")
          version=$(node -p "require('./packages/core/package.json').version")
          grep -q "^## $version " CHANGELOG.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
          if grep "^## $version " CHANGELOG.md | grep -qi unreleased; then echo "CHANGELOG.md heading for $version still says unreleased: add the date"; exit 1; fi
          # A prerelease never goes to latest: 0.1.0-alpha.1 -> dist-tag alpha; any other prerelease id (0-, RC.1, 1.beta) -> next.
          case "$version" in
            *-*)
              alpha=$(printf '%s' "$version" | sed -nE 's/^[^-]+-([a-z]+)([.-].*)?$/\1/p')
              tag=${alpha:-next}
              ;;
            *) tag=latest ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Exact-version check: comparing against `latest` alone would mis-skip prereleases and re-runs.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "npm already has $name@$version: nothing to publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "will publish $name@$version"
          fi

  verify:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
        env:
          CI: "true"
      - run: bun run test:bun
      - run: bun run check
        env:
          PACK_DIR: ${{ runner.temp }}/pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: write # push the release tag
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      # No checkout of code to run, no install, no build: the job holds the OIDC token and publishes the exact
      # tarball `verify` checked (PACK_DIR in scripts/check-packages.ts). Checkout is only for pushing the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in a release build
      # Trusted publishing needs npm >= 11.5.1 (npm trust / stage publish: >= 11.15); Node 24 may bundle an older one.
      - run: npm install -g npm@11.21.1
      - name: Publish
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        # `plan`'s `npm view` can lag the registry right after a concurrent run published, so an exact-version
        # "cannot publish over" 403 means this version is already out: succeed instead of failing.
        run: |
          # provenance is automatic with trusted publishing from a public repo
          npm publish "./pack/xrp-dev-$VERSION.tgz" --tag "$TAG" 2> publish.err && { cat publish.err >&2; exit 0; }
          cat publish.err >&2
          grep -q "previously published versions: $VERSION\." publish.err || exit 1
          echo "npm already has xrp-dev@$VERSION: nothing to publish"
      - name: Tag and release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then echo "v$VERSION already tagged: nothing to release"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "xrp-dev v$VERSION"
          git push origin "refs/tags/v$VERSION"
          # Notes = this version's CHANGELOG section; a prerelease is flagged so it never shows as "Latest".
          awk -v h="## $VERSION " 'index($0,h)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ "$TAG" = latest ] && flag="" || flag="--prerelease"
          gh release create "v$VERSION" "./pack/xrp-dev-$VERSION.tgz" --verify-tag --title "xrp-dev v$VERSION" --notes-file notes.md $flag
