version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    # `vite` (the vite-plus-core alias) and `vite-plus` are pinned together in the root `catalog`; Dependabot would bump only one. Bump by hand.
    ignore:
      - dependency-name: vite-plus
      - dependency-name: "@voidzero-dev/*"
    groups:
      minor-and-patch: { update-types: [minor, patch] }
